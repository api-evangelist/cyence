name: Cyence
description: >-
  Cyence is a cyber risk analytics and modeling solution — originally an
  independent InsurTech startup (backed by IVP and others) and acquired by
  Guidewire in 2017 — that helps insurers, reinsurers, brokers, and managing
  general agents quantify, underwrite, and manage cyber insurance risk in
  financial terms. It combines internet-scale data collection, data science,
  and economic loss modeling to produce exposure signals, breach-probability
  estimates, and portfolio accumulation and catastrophe scenarios. Cyence data
  and scores are delivered to carriers through Guidewire Cloud and are
  available via a REST API for pricing, risk selection, and underwriting
  workflow automation. API access is partner-gated through a Guidewire account
  rather than a public self-serve developer portal.
